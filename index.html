<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Modul pembelajaran pseudocode interaktif untuk siswa SMK kelas X: pengertian, struktur, aturan penulisan, kata kunci, contoh, latihan, dan debugging pseudocode.">
<title>Pseudocode Lab – Modul Interaktif Informatika SMK Kelas X</title>
<style>


:root{
  --bg:#f5f7fb;
  --surface:#ffffff;
  --surface-2:#f0f3f8;
  --text:#172033;
  --muted:#6d778a;
  --border:#e4e8f0;
  --primary:#2457d6;
  --primary-2:#4f7df0;
  --primary-soft:#eaf0ff;
  --success:#16865b;
  --warning:#b97900;
  --danger:#c73d4a;
  --shadow:0 12px 30px rgba(28,43,75,.08);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#11151d;
  --surface:#181e29;
  --surface-2:#222a38;
  --text:#f2f5fa;
  --muted:#9ca8bb;
  --border:#30394a;
  --primary:#6f93ff;
  --primary-2:#8ba7ff;
  --primary-soft:#222e50;
  --shadow:0 12px 30px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
button{cursor:pointer}
.app-shell{display:flex;min-height:100vh}
.sidebar{width:270px;position:fixed;inset:0 auto 0 0;background:var(--surface);border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:0 9px 24px;border-bottom:1px solid var(--border)}
.word-logo,.welcome-icon{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,#1f52ce,#4f7df0);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 7px 18px rgba(36,87,214,.25)}
.brand strong{display:block;font-size:14px}
.brand span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.nav-menu{padding-top:18px;overflow:auto}
.nav-item{position:relative;z-index:30;width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;text-align:left;margin-bottom:3px;font-size:13px;transition:.18s}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.nav-icon{width:20px;text-align:center;font-size:15px}
.nav-section-title{font-size:10px;letter-spacing:1.2px;font-weight:800;color:var(--muted);padding:18px 12px 8px}
.chapter-btn{position:relative;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:rgba(36,87,214,.15)}
.chapter-btn .chapter-number{width:20px;height:20px;border:1px solid currentColor;border-radius:6px;display:grid;place-items:center;font-size:9px}
.nav-badge{margin-left:auto;font-size:10px;background:var(--surface-2);padding:3px 7px;border-radius:20px}
.sidebar-bottom{margin-top:auto;padding-top:18px;border-top:1px solid var(--border)}
.mini-progress{padding:0 10px 13px}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:7px}
.progress-label strong{color:var(--text)}
.progress-track{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--primary-2));border-radius:99px;transition:width .35s}
.reset-btn{width:100%;border:0;background:transparent;color:var(--muted);font-size:11px;padding:8px}
.reset-btn:hover{color:var(--danger)}
.main{margin-left:270px;width:calc(100% - 270px);min-width:0}
.topbar{height:74px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}
.breadcrumb{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.breadcrumb strong{color:var(--text)}
.top-actions{display:flex;align-items:center;gap:10px}
.search-wrap{position:relative;display:flex;align-items:center;width:260px;height:39px;background:var(--surface-2);border-radius:11px;padding:0 12px;gap:7px}
.search-wrap input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}
.search-wrap input::placeholder{color:var(--muted)}
.search-results{position:absolute;right:0;top:46px;width:330px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:7px;max-height:360px;overflow:auto}
.search-result{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:9px;color:var(--text)}
.search-result:hover{background:var(--surface-2)}
.search-result small{display:block;color:var(--muted);margin-top:3px}
.hidden{display:none!important}
.icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);width:39px;height:39px;border-radius:11px;display:grid;place-items:center}
.user-pill{height:39px;border:1px solid var(--border);padding:0 10px 0 5px;border-radius:11px;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600}
.user-pill span:first-child{width:28px;height:28px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.content{max-width:1250px;margin:0 auto;padding:32px}
.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:22px;margin-bottom:22px}
.hero-card{background:linear-gradient(135deg,#173c9a,#315fd4 62%,#6688ed);color:#fff;border-radius:24px;padding:34px;position:relative;overflow:hidden;min-height:270px}
.hero-card:after{content:"W";position:absolute;right:35px;bottom:-50px;font-size:240px;font-weight:800;color:rgba(255,255,255,.08);line-height:1}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.4px;opacity:.8}
.hero h1{font-size:30px;line-height:1.15;margin:13px 0 10px;max-width:600px}
.hero p{max-width:600px;line-height:1.65;font-size:13px;opacity:.88}
.hero-actions{display:flex;gap:10px;margin-top:24px;position:relative;z-index:1}
.primary-btn,.secondary-btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.primary-btn{background:var(--primary);color:#fff}
.hero .primary-btn{background:#fff;color:#2049b5}
.secondary-btn{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.full{width:100%}
.profile-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:25px;box-shadow:var(--shadow)}
.profile-avatar{width:56px;height:56px;border-radius:16px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:21px;margin-bottom:18px}
.profile-card h3{margin:0 0 5px;font-size:18px}
.profile-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.profile-progress{margin-top:22px}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:30px 0 14px}
.section-head h2{margin:0;font-size:17px}
.section-head p{margin:4px 0 0;color:var(--muted);font-size:11px}
.link-btn{border:0;background:transparent;color:var(--primary);font-weight:700;font-size:11px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:17px}
.stat-icon{font-size:19px;margin-bottom:12px}
.stat-card span{font-size:10px;color:var(--muted)}
.stat-card strong{display:block;font-size:22px;margin-top:4px}
.chapter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.chapter-card{background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:18px;cursor:pointer;transition:.2s;position:relative}
.chapter-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.chapter-top{display:flex;justify-content:space-between;align-items:center}
.chapter-num{width:30px;height:30px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:11px;font-weight:800}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.status-dot.done{background:var(--success)}
.chapter-card h3{font-size:13px;margin:15px 0 7px}
.chapter-card p{font-size:10px;color:var(--muted);line-height:1.55;margin:0;min-height:32px}
.card-progress{margin-top:14px}
.card-progress .progress-track{height:5px}
.learning-page{max-width:900px}
.page-title{margin-bottom:22px}
.page-title h1{font-size:27px;margin:5px 0 8px}
.page-title p{color:var(--muted);font-size:12px;line-height:1.6;margin:0}
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:15px}
.info-card h2{font-size:17px;margin:0 0 12px}
.info-card p{font-size:13px;line-height:1.75;color:var(--muted)}
.placeholder-visual{min-height:220px;border:2px dashed var(--border);border-radius:16px;background:var(--surface-2);display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px}
.placeholder-visual strong{display:block;color:var(--text);margin-bottom:5px}
.page-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.empty-state{text-align:center;padding:70px 20px;background:var(--surface);border:1px dashed var(--border);border-radius:18px}
.empty-state h2{margin:0 0 8px}.empty-state p{color:var(--muted);font-size:12px}
.modal-backdrop{position:fixed;inset:0;background:rgba(8,15,29,.65);backdrop-filter:blur(5px);display:grid;place-items:center;z-index:100;padding:20px}
.welcome-card{width:min(370px,calc(100% - 32px));background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px 24px 20px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.welcome-icon{margin-bottom:12px}
.welcome-card h1{font-size:24px;margin:7px 0 6px}
.welcome-card p{font-size:11px;color:var(--muted);line-height:1.55;margin-bottom:17px}
.welcome-card label{font-size:10px;font-weight:700;display:block;margin-bottom:6px}
.welcome-card input{width:100%;height:40px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:10px;padding:0 12px;outline:none;margin-bottom:8px}
.welcome-card input:focus{border-color:var(--primary)}
.welcome-card small{display:block;color:var(--muted);font-size:8.5px;line-height:1.45;margin-top:10px}
.toast{position:fixed;bottom:24px;right:24px;background:#172033;color:#fff;padding:12px 16px;border-radius:11px;font-size:11px;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s;z-index:150}
.toast.show{transform:translateY(0);opacity:1}
.mobile-only{display:none}

@media(max-width:1000px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .chapter-grid{grid-template-columns:repeat(2,1fr)}
  .hero{grid-template-columns:1fr}
}
@media(max-width:760px){
  .sidebar{transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;width:100%}
  .topbar{padding:0 15px}
  .mobile-only{display:grid}
  .breadcrumb{display:none}
  .search-wrap{width:170px}
  .user-pill span:last-child{display:none}
  .content{padding:20px 15px}
  .hero-card{padding:25px;min-height:260px}
  .hero h1{font-size:25px}
  .chapter-grid{grid-template-columns:1fr}
}
@media(max-width:500px){
  .stats-grid{grid-template-columns:1fr 1fr;gap:9px}
  .stat-card{padding:13px}
  .stat-card strong{font-size:18px}
  .search-wrap{width:38px;padding:0 10px}
  .search-wrap input{display:none}
  .search-results{right:-70px;width:300px}
  .hero-actions{flex-direction:column}
}
@media print{
  .sidebar,.topbar,.page-nav,.hero-actions,.link-btn,.reset-btn{display:none!important}
  .main{margin:0;width:100%}.content{max-width:none;padding:0}
  body{background:#fff;color:#000}
}

/* ===== Stage 2: learning content ===== */
.lesson-layout{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:18px}
.lesson-main{min-width:0}
.lesson-toc{position:sticky;top:96px;align-self:start;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px}
.lesson-toc h3{font-size:11px;margin:0 0 10px}
.lesson-toc button{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;font-size:10px;padding:8px;border-radius:8px}
.lesson-toc button:hover{background:var(--surface-2);color:var(--text)}
.lesson-section{scroll-margin-top:95px}
.lesson-section h2{font-size:18px;margin:0 0 10px}
.lesson-section h3{font-size:14px;margin:18px 0 8px}
.lesson-section p,.lesson-section li{font-size:12px;line-height:1.75;color:var(--muted)}
.lesson-section ul,.lesson-section ol{padding-left:20px}
.definition-box{background:var(--primary-soft);border-left:4px solid var(--primary);padding:15px 16px;border-radius:0 12px 12px 0;margin:15px 0}
.definition-box strong{display:block;color:var(--text);font-size:12px;margin-bottom:5px}
.example-box{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:16px;margin:15px 0}
.example-label{font-size:9px;font-weight:800;letter-spacing:1px;color:var(--primary);margin-bottom:8px}
.tip-box{border:1px solid rgba(22,134,91,.25);background:rgba(22,134,91,.06);border-radius:14px;padding:14px;margin:15px 0}
.tip-box strong{color:var(--success);font-size:11px}
.warning-box{border:1px solid rgba(185,121,0,.25);background:rgba(185,121,0,.06);border-radius:14px;padding:14px;margin:15px 0}
.warning-box strong{color:var(--warning);font-size:11px}
.visual-word{background:#fff;border:1px solid #d9dce3;border-radius:12px;overflow:hidden;box-shadow:0 7px 18px rgba(0,0,0,.06);color:#20242b}
.visual-titlebar{height:28px;background:#f4f5f7;display:flex;align-items:center;padding:0 10px;font-size:9px;color:#666;gap:8px}
.visual-ribbon{padding:7px;background:#fff;border-bottom:1px solid #ddd}
.visual-tabs{display:flex;gap:15px;font-size:8px;margin-bottom:8px;color:#444}
.visual-tabs .selected{color:#185abd;font-weight:700;border-bottom:2px solid #185abd;padding-bottom:4px}
.visual-tools{display:flex;gap:8px;align-items:center}
.visual-tool{width:37px;height:28px;border:1px solid #e1e1e1;border-radius:5px;display:grid;place-items:center;font-size:8px;background:#fafafa}
.visual-body{min-height:160px;padding:18px;background:#e9ebee}
.visual-page{background:#fff;width:72%;min-height:150px;margin:auto;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.visual-page h4{font-size:13px;margin:0 0 12px}.visual-page p{font-size:8px;line-height:1.6;color:#555}
.hotspot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hotspot{border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:12px;cursor:pointer;text-align:left}
.hotspot:hover{border-color:var(--primary);background:var(--primary-soft)}
.hotspot strong{font-size:10px;display:block}.hotspot span{font-size:9px;color:var(--muted)}
.step-list{counter-reset:step;display:grid;gap:9px;margin:15px 0}
.step{display:flex;gap:10px;background:var(--surface-2);border-radius:12px;padding:11px}
.step:before{counter-increment:step;content:counter(step);min-width:25px;height:25px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800}
.step strong{font-size:11px}.step p{margin:3px 0 0;font-size:10px}
.interactive-demo{border:1px solid var(--border);border-radius:16px;padding:18px;background:var(--surface);margin:15px 0}
.demo-toolbar{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.demo-btn{min-width:34px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--text);font-weight:700;font-size:11px}
.demo-btn:hover,.demo-btn.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.demo-size{height:32px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:11px;padding:0 7px}
.demo-text{margin-top:15px;border:1px solid var(--border);border-radius:10px;padding:17px;min-height:70px;outline:0;background:var(--surface)}
.demo-status{font-size:10px;color:var(--muted);margin-top:8px}
.exercise{background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:16px;padding:18px;margin:18px 0}
.exercise h3{margin:0 0 8px;font-size:14px}
.exercise p{font-size:11px;color:var(--muted);line-height:1.6}
.exercise-options{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.choice-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:8px 11px;font-size:10px}
.choice-btn:hover{border-color:var(--primary)}
.choice-btn.correct{border-color:var(--success);background:rgba(22,134,91,.09);color:var(--success)}
.choice-btn.wrong{border-color:var(--danger);background:rgba(199,61,74,.08);color:var(--danger)}
.feedback{display:none;margin-top:10px;border-radius:10px;padding:11px;font-size:10px;line-height:1.5}
.feedback.show{display:block}.feedback.good{background:rgba(22,134,91,.08);color:var(--success)}.feedback.bad{background:rgba(199,61,74,.08);color:var(--danger)}
.lesson-footer{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.quiz-page{max-width:900px}
.quiz-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px}
.quiz-counter{font-size:11px;color:var(--muted)}
.quiz-progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px}
.quiz-question{font-size:16px;line-height:1.5;margin:0 0 17px}
.quiz-option{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:13px;margin-bottom:8px;font-size:11px}
.quiz-option:hover{border-color:var(--primary);background:var(--primary-soft)}
.quiz-option .letter{width:23px;height:23px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;flex:none}
.quiz-option.selected{border-color:var(--primary);background:var(--primary-soft)}
.quiz-option.correct{border-color:var(--success);background:rgba(22,134,91,.08)}
.quiz-option.wrong{border-color:var(--danger);background:rgba(199,61,74,.08)}
.quiz-feedback{margin-top:13px;padding:13px;border-radius:11px;font-size:10px;line-height:1.6;display:none}
.quiz-feedback.show{display:block}.quiz-feedback.good{background:rgba(22,134,91,.08);color:var(--success)}.quiz-feedback.bad{background:rgba(199,61,74,.08);color:var(--danger)}
.quiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.quiz-result{text-align:center;padding:35px 15px}.score-ring{width:120px;height:120px;border-radius:50%;margin:0 auto 18px;background:conic-gradient(var(--primary) var(--score),var(--surface-2) 0);display:grid;place-items:center}
.score-ring:before{content:"";width:92px;height:92px;border-radius:50%;background:var(--surface);position:absolute}
.score-ring span{position:relative;font-size:23px;font-weight:800}
@media(max-width:900px){.lesson-layout{grid-template-columns:1fr}.lesson-toc{display:none}}
@media(max-width:600px){.hotspot-grid{grid-template-columns:1fr}.lesson-footer{flex-direction:column}.quiz-card{padding:17px}}

/* ===== Tahap 3: interactive visual components ===== */
.alignment-demo,.spacing-demo,.indent-demo,.columns-demo,.picture-demo,.shape-demo,.merge-demo{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:18px;margin-top:14px}
.alignment-demo button,.spacing-demo button,.indent-demo button,.columns-demo button,.picture-controls button,.wrap-buttons button,.table-controls button,.shape-demo button,.merge-demo button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 12px;margin:4px;cursor:pointer;font-weight:700;font-size:12px}
.alignment-demo button:hover,.spacing-demo button:hover,.indent-demo button:hover,.columns-demo button:hover,.picture-controls button:hover,.wrap-buttons button:hover,.table-controls button:hover,.shape-demo button:hover,.merge-demo button:hover{border-color:var(--primary);color:var(--primary)}
.alignment-demo p,.spacing-demo p,.indent-demo p{background:var(--surface);border-radius:12px;padding:16px;line-height:1.55;margin:12px 0 0;transition:.2s}
.list-demo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.list-demo>div{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:16px}

<style id="hide-unrequested-utility-buttons">
  #kka7QaLauncher, #kka8ContrastLauncher { display: none !important; }
</style>

<style id="readability-contrast-improvements">
  /* Perbaikan keterbacaan tanpa mengubah tata letak atau fungsi aplikasi */
  :root { --muted: #4b5568; }
  [data-theme="dark"] { --muted: #c0cada; }

  /* Teks penjelas dan teks isi pada komponen umum */
  p, li, label, td, th,
  .muted, .text-muted, .helper-text, .form-text, .hint,
  .description, .subtitle, .card-text, .section-desc,
  .field-hint, .help-text, .small-text {
    color: var(--text);
  }

  /* Elemen yang memang memakai warna sekunder tetap jelas di kedua tema */
  .brand span, .nav-item, .nav-section-title, .muted, .text-muted,
  .helper-text, .form-text, .hint, .description, .subtitle,
  .field-hint, .help-text, .small-text {
    color: var(--muted);
  }

  input::placeholder, textarea::placeholder {
    color: var(--muted) !important;
    opacity: 1;
  }

  /* Tautan tetap terlihat jelas tanpa mengubah warna tombol atau badge */
  a:not(.nav-item):not(.chapter-btn) {
    text-decoration-thickness: max(1px, .06em);
    text-underline-offset: .16em;
  }
</style>

<style id="light-mode-contrast-fix">

<style id="final-readable-contrast-audit">
/* Final contrast pass: strengthen secondary text while preserving the existing visual system. */
:root {
  --muted: #566276;
  --border: #d5dce7;
  --success: #087347;
  --warning: #805400;
  --danger: #b42332;
}
html[data-theme="dark"], html.dark-mode, .dark-mode {
  --bg: #11151d;
  --surface: #181e29;
  --surface-2: #242d3c;
  --text: #f4f6fb;
  --muted: #bac5d7;
  --border: #465166;
  --primary: #9ab2ff;
  --primary-2: #b4c5ff;
  --primary-soft: #26375f;
  --success: #69d6a3;
  --warning: #ffd078;
  --danger: #ff929b;
}
/* Ensure secondary copy remains readable in both themes. */
html:not([data-theme="dark"]):not(.dark-mode) :is(.lesson-section p,.lesson-section li,.profile-card p,.section-head p,.chapter-card p,.page-title p,.info-card p,.empty-state p,.welcome-card p,.welcome-card small,.brand span,.breadcrumb,.progress-label,.nav-section-title,.stat-card span,.muted,.subtitle,.description,.helper-text,.text-muted,.result-stat small,.result-stat span,.progress-chapter small,.exam-result-card p,.search-result small,.search-result-item small,.search-empty,.uat-note p) {
  color: #526176;
}

html.dark-mode :is(.lesson-section p,.lesson-section li,.profile-card p,.section-head p,.chapter-card p,.page-title p,.info-card p,.empty-state p,.welcome-card p,.welcome-card small,.brand span,.breadcrumb,.progress-label,.nav-section-title,.stat-card span,.muted,.subtitle,.description,.helper-text,.text-muted,.result-stat small,.result-stat span,.progress-chapter small,.exam-result-card p,.search-result small,.search-result-item small,.search-empty,.uat-note p) {
  color: #bac5d7;
}
/* Form controls and placeholders need visible text and boundaries. */

.pc-quiz-option{display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);padding:12px;margin:7px 0;font-size:12px;cursor:pointer}.pc-quiz-option:hover,.pc-quiz-option.chosen{border-color:var(--primary);background:var(--primary-soft)}

<script>
(() => {
'use strict';
const topics = [
 {title:'Pengertian pseudocode',desc:'Definisi, tujuan, ciri, dan kapan pseudocode digunakan.',body:`<p><strong>Pseudocode (kode semu)</strong> adalah cara menuliskan langkah-langkah penyelesaian masalah dengan notasi yang menyerupai kode program, tetapi tidak terikat pada sintaks satu bahasa pemrograman tertentu. Pseudocode ditujukan agar logika mudah dibaca dan diperiksa manusia.</p><h3>Tujuan pseudocode</h3><ul><li>Merencanakan logika sebelum menulis kode program.</li><li>Menjelaskan langkah penyelesaian masalah secara runtut.</li><li>Membantu menemukan kesalahan logika lebih awal.</li><li>Memudahkan komunikasi antara orang yang merancang dan orang yang membuat program.</li></ul><h3>Ciri pseudocode yang baik</h3><ul><li>Jelas, ringkas, dan tidak bermakna ganda.</li><li>Langkah disusun secara logis dan berurutan.</li><li>Memakai kata kunci yang konsisten.</li><li>Memiliki masukan, proses, dan/atau keluaran sesuai kebutuhan masalah.</li></ul><div class="pc-note">Pseudocode bukan bahasa pemrograman yang bisa langsung dijalankan. Tidak ada satu standar sintaks universal; materi ini memakai satu konvensi yang konsisten untuk belajar.</div><h3>Contoh sederhana</h3><pre class="pc-code">PROGRAM SapaPengguna
DEKLARASI:
    nama : STRING
DESKRIPSI:
    INPUT nama
    OUTPUT "Halo, ", nama</pre>`},
 {title:'Struktur pseudocode: judul, deklarasi, deskripsi',desc:'Struktur tiga bagian yang harus dikenali dan ditulis dengan benar.',body:`<p>Dalam konvensi yang dipakai pada materi ini, pseudocode disusun menjadi tiga bagian: <strong>Judul</strong>, <strong>Deklarasi</strong>, dan <strong>Deskripsi</strong>. Deklarasi berisi nama serta tipe data yang dipakai; deskripsi berisi langkah penyelesaian.</p><h3>1. Judul</h3><p>Menamai algoritma secara singkat dan menjelaskan tujuannya. Gunakan nama yang jelas, misalnya <code>PROGRAM HitungLuasPersegiPanjang</code>.</p><h3>2. Deklarasi</h3><p>Mendaftarkan variabel, konstanta, dan bila diperlukan tipe data atau subprogram yang digunakan. Penulisan tipe di samping nama membantu pembaca mengetahui jenis nilainya.</p><h3>3. Deskripsi</h3><p>Berisi instruksi, misalnya INPUT, perhitungan, percabangan, perulangan, dan OUTPUT. Urutannya menunjukkan urutan pelaksanaan.</p><pre class="pc-code">PROGRAM HitungLuasPersegiPanjang
{Menghitung luas dari panjang dan lebar}

DEKLARASI:
    panjang : REAL
    lebar   : REAL
    luas    : REAL

DESKRIPSI:
    INPUT panjang
    INPUT lebar
    luas ← panjang * lebar
    OUTPUT "Luas = ", luas</pre><div class="pc-note">Nama bagian dan gaya tanda baca bisa berbeda antar buku. Yang penting untuk tugas ini: jangan menukar fungsi bagian Judul, Deklarasi, dan Deskripsi, serta gunakan format yang konsisten.</div>`},
 {title:'Notasi dan aturan penulisan',desc:'Simbol penugasan, perbandingan, komentar, kata kunci, dan indentasi.',body:`<p>Pseudocode tidak memiliki sintaks baku universal. Agar contoh tidak membingungkan, modul ini menggunakan notasi berikut secara konsisten.</p><table><thead><tr><th>Notasi</th><th>Makna</th><th>Contoh</th></tr></thead><tbody><tr><td><code>←</code></td><td>Penugasan: menyimpan nilai ke variabel</td><td><code>total ← harga * jumlah</code></td></tr><tr><td><code>=</code></td><td>Membandingkan kesamaan</td><td><code>IF kode = 10 THEN</code></td></tr><tr><td><code>&lt;&gt;</code></td><td>Tidak sama dengan</td><td><code>IF jawaban &lt;&gt; "ya" THEN</code></td></tr><tr><td><code>&lt;, &gt;, &lt;=, &gt;=</code></td><td>Perbandingan</td><td><code>IF nilai &gt;= 75 THEN</code></td></tr><tr><td><code>{ ... }</code></td><td>Komentar/penjelasan, bukan instruksi</td><td><code>{Menghitung luas}</code></td></tr></tbody></table><h3>Aturan yang perlu dijaga</h3><ul><li>Satu instruksi utama per baris.</li><li>Nama variabel harus konsisten, misalnya jangan menulis <code>totalHarga</code> lalu memakai <code>total_harga</code> seolah nama yang sama.</li><li>Gunakan tanda kutip untuk nilai teks, misalnya <code>"SMK"</code>.</li><li>Indentasi instruksi di dalam IF atau perulangan agar blok terlihat jelas.</li><li>Jangan mencampur simbol penugasan dan perbandingan.</li></ul><pre class="pc-code">DEKLARASI:
    harga, jumlah, total : INTEGER
DESKRIPSI:
    INPUT harga
    INPUT jumlah
    total ← harga * jumlah
    IF total >= 100000 THEN
        OUTPUT "Belanja besar"
    ELSE
        OUTPUT "Belanja biasa"
    END IF</pre>`},
 {title:'Tipe data',desc:'Mengenali INTEGER, REAL, STRING, CHAR, dan BOOLEAN.',body:`<p><strong>Tipe data</strong> menjelaskan jenis nilai yang disimpan oleh variabel. Nama tipe di bawah adalah istilah umum yang sering dipakai dalam pembelajaran; ejaan persisnya dapat berbeda pada bahasa pemrograman tertentu.</p><table><thead><tr><th>Tipe</th><th>Kegunaan</th><th>Contoh nilai</th></tr></thead><tbody><tr><td><code>INTEGER</code></td><td>Bilangan bulat</td><td><code>0</code>, <code>17</code>, <code>-4</code></td></tr><tr><td><code>REAL</code></td><td>Bilangan yang dapat memiliki pecahan</td><td><code>72.5</code>, <code>3.14</code></td></tr><tr><td><code>STRING</code></td><td>Rangkaian karakter/teks</td><td><code>"Dina"</code>, <code>"SMK X"</code></td></tr><tr><td><code>CHAR</code></td><td>Satu karakter</td><td><code>'A'</code>, <code>'7'</code></td></tr><tr><td><code>BOOLEAN</code></td><td>Nilai logika</td><td><code>TRUE</code> atau <code>FALSE</code></td></tr></tbody></table><pre class="pc-code">PROGRAM ContohTipeData
DEKLARASI:
    umur       : INTEGER
    tinggi     : REAL
    nama       : STRING
    kelas      : CHAR
    sudahLulus : BOOLEAN
DESKRIPSI:
    umur ← 16
    tinggi ← 165.5
    nama ← "Nadia"
    kelas ← 'X'
    sudahLulus ← FALSE
    OUTPUT nama, umur, tinggi, kelas, sudahLulus</pre><div class="pc-note">Perhatikan bahwa angka 7 bertipe INTEGER, sedangkan "7" bertipe STRING karena ditulis sebagai teks. CHAR biasanya satu karakter, sementara STRING dapat terdiri dari banyak karakter.</div>`},
 {title:'Variabel, konstanta, dan deklarasi',desc:'Mendeklarasikan nama, menetapkan nilai, dan membedakan variabel dengan konstanta.',body:`<p><strong>Variabel</strong> adalah nama untuk nilai yang dapat berubah selama algoritma berjalan. <strong>Konstanta</strong> adalah nama untuk nilai yang ditetapkan dan tidak diubah dalam algoritma tersebut. Deklarasi memperkenalkan nama yang akan digunakan.</p><pre class="pc-code">PROGRAM HitungKelilingLingkaran
DEKLARASI:
    PI : REAL ← 3.14   {konstanta}
    jariJari : REAL    {variabel}
    keliling : REAL
DESKRIPSI:
    INPUT jariJari
    keliling ← 2 * PI * jariJari
    OUTPUT keliling</pre><p>Nama variabel sebaiknya bermakna, tidak memakai spasi, dan tidak berubah-ubah penulisannya. Contoh nama yang baik: <code>jumlahSiswa</code>, <code>hargaBarang</code>, <code>nilaiUjian</code>.</p><h3>Contoh penugasan bertahap</h3><pre class="pc-code">DEKLARASI:
    x, y : INTEGER
DESKRIPSI:
    x ← 5
    y ← x + 3
    x ← 10
    OUTPUT x, y   {hasil: 10 dan 8}</pre><p>Nilai <code>y</code> tetap 8 karena perhitungannya dilakukan sebelum nilai <code>x</code> diubah menjadi 10.</p>`},
 {title:'Input, proses, dan output dalam pseudocode',desc:'Menulis instruksi masukan, pengolahan data, dan keluaran.',body:`<p><code>INPUT</code> menyatakan data yang dibaca dari pengguna atau sumber masukan. Baris proses melakukan perhitungan atau pengolahan. <code>OUTPUT</code> menampilkan hasil. Tidak setiap algoritma harus meminta input; nilai dapat pula ditetapkan dalam algoritma.</p><h3>Contoh 1 — menghitung luas persegi</h3><pre class="pc-code">PROGRAM LuasPersegi
DEKLARASI:
    sisi, luas : INTEGER
DESKRIPSI:
    INPUT sisi
    luas ← sisi * sisi
    OUTPUT "Luas = ", luas</pre><h3>Contoh 2 — menghitung rata-rata tiga nilai</h3><pre class="pc-code">PROGRAM RataRataTigaNilai
DEKLARASI:
    n1, n2, n3, rataRata : REAL
DESKRIPSI:
    INPUT n1, n2, n3
    rataRata ← (n1 + n2 + n3) / 3
    OUTPUT "Rata-rata = ", rataRata</pre><p>Kurung pada rumus rata-rata memperjelas bahwa jumlah ketiga nilai dibagi tiga.</p>`},
 {title:'Operator dan ekspresi',desc:'Operator aritmetika, relasional, dan logika pada ekspresi pseudocode.',body:`<p><strong>Ekspresi</strong> menggabungkan nilai, variabel, dan operator untuk menghasilkan nilai baru.</p><h3>Operator aritmetika</h3><table><thead><tr><th>Operator</th><th>Makna</th><th>Contoh</th></tr></thead><tbody><tr><td><code>+</code></td><td>Penjumlahan</td><td><code>7 + 2 = 9</code></td></tr><tr><td><code>-</code></td><td>Pengurangan</td><td><code>7 - 2 = 5</code></td></tr><tr><td><code>*</code></td><td>Perkalian</td><td><code>7 * 2 = 14</code></td></tr><tr><td><code>/</code></td><td>Pembagian</td><td><code>7 / 2 = 3.5</code> pada pembagian real</td></tr><tr><td><code>MOD</code></td><td>Sisa pembagian bilangan bulat</td><td><code>7 MOD 2 = 1</code></td></tr></tbody></table><h3>Operator relasional dan logika</h3><p>Relasional: <code>=</code>, <code>&lt;&gt;</code>, <code>&lt;</code>, <code>&gt;</code>, <code>&lt;=</code>, <code>&gt;=</code>. Hasil perbandingan berupa TRUE atau FALSE. Logika: <code>AND</code> (keduanya benar), <code>OR</code> (minimal satu benar), dan <code>NOT</code> (membalik nilai logika).</p><pre class="pc-code">DEKLARASI:
    a, b, hasil : INTEGER
    bolehMasuk : BOOLEAN
DESKRIPSI:
    a ← 17
    b ← 5
    hasil ← a MOD b
    bolehMasuk ← (a >= 17) AND (b <> 0)
    OUTPUT hasil, bolehMasuk  {hasil: 2, TRUE}</pre>`},
 {title:'Urutan instruksi dan penugasan',desc:'Membaca deskripsi dari atas ke bawah dan memahami perubahan nilai.',body:`<p>Instruksi dalam bagian Deskripsi biasanya dijalankan berurutan dari atas ke bawah, kecuali ketika percabangan atau perulangan mengubah alur. Penugasan menghitung nilai di sisi kanan lalu menyimpannya ke nama di sisi kiri.</p><pre class="pc-code">PROGRAM HitungSubtotal
DEKLARASI:
    harga, jumlah, subtotal : INTEGER
DESKRIPSI:
    harga ← 12000
    jumlah ← 3
    subtotal ← harga * jumlah
    OUTPUT subtotal  {36000}</pre><h3>Contoh menelusuri perubahan nilai</h3><pre class="pc-code">DEKLARASI:
    x, y : INTEGER
DESKRIPSI:
    x ← 4
    y ← 2
    x ← x + y
    y ← x * 2
    OUTPUT x, y  {6, 12}</pre><p>Jangan membaca <code>x ← x + y</code> sebagai persamaan matematika. Itu berarti hitung nilai lama x ditambah y, lalu simpan hasilnya ke x.</p>`},
 {title:'Percabangan IF, ELSE, dan ELSE IF',desc:'Menentukan instruksi yang dijalankan berdasarkan kondisi.',body:`<p>Percabangan memilih instruksi berdasarkan kondisi yang bernilai TRUE atau FALSE. Dalam notasi modul ini, blok ditulis dengan <code>IF ... THEN</code>, pilihan alternatif <code>ELSE</code>, dan ditutup dengan <code>END IF</code>.</p><h3>Contoh 1 — menentukan kelulusan</h3><pre class="pc-code">PROGRAM CekKelulusan
DEKLARASI:
    nilai : INTEGER
DESKRIPSI:
    INPUT nilai
    IF nilai >= 75 THEN
        OUTPUT "Lulus"
    ELSE
        OUTPUT "Belum lulus"
    END IF</pre><h3>Contoh 2 — kategori nilai</h3><pre class="pc-code">PROGRAM KategoriNilai
DEKLARASI:
    nilai : INTEGER
DESKRIPSI:
    INPUT nilai
    IF nilai >= 90 THEN
        OUTPUT "A"
    ELSE IF nilai >= 80 THEN
        OUTPUT "B"
    ELSE IF nilai >= 70 THEN
        OUTPUT "C"
    ELSE
        OUTPUT "D"
    END IF</pre><p>Urutan kondisi penting: kondisi yang lebih tinggi diperiksa lebih dahulu. Untuk nilai 85, kondisi pertama FALSE dan kondisi kedua TRUE sehingga output-nya B.</p>`},
 {title:'Perulangan FOR',desc:'Mengulang instruksi dengan jumlah atau rentang iterasi yang diketahui.',body:`<p><code>FOR</code> lazim digunakan ketika rentang nilai penghitung diketahui. Dalam notasi contoh ini, <code>FOR i ← awal TO akhir</code> mencakup nilai awal dan akhir, bertambah satu setiap putaran kecuali ditentukan lain.</p><h3>Contoh 1 — tampilkan 1 sampai 5</h3><pre class="pc-code">PROGRAM TampilAngka
DEKLARASI:
    i : INTEGER
DESKRIPSI:
    FOR i ← 1 TO 5 DO
        OUTPUT i
    END FOR</pre><h3>Contoh 2 — jumlahkan angka 1 sampai 4</h3><pre class="pc-code">PROGRAM JumlahEmpatAngka
DEKLARASI:
    i, total : INTEGER
DESKRIPSI:
    total ← 0
    FOR i ← 1 TO 4 DO
        total ← total + i
    END FOR
    OUTPUT total  {10}</pre><p>Variabel <code>total</code> harus diberi nilai awal 0 sebelum penjumlahan. Jika tidak, nilai awalnya tidak jelas.</p>`},
 {title:'Perulangan WHILE',desc:'Mengulang instruksi selama kondisi bernilai TRUE.',body:`<p><code>WHILE</code> memeriksa kondisi sebelum isi perulangan dijalankan. Jika kondisi sudah FALSE sejak awal, isi blok tidak dijalankan sama sekali. Perubahan variabel yang memengaruhi kondisi harus dirancang agar perulangan dapat berhenti.</p><h3>Contoh 1 — tampilkan 1 sampai 3</h3><pre class="pc-code">PROGRAM TampilTigaAngka
DEKLARASI:
    i : INTEGER
DESKRIPSI:
    i ← 1
    WHILE i <= 3 DO
        OUTPUT i
        i ← i + 1
    END WHILE</pre><h3>Contoh 2 — hitung jumlah sampai batas</h3><pre class="pc-code">PROGRAM JumlahSampaiLima
DEKLARASI:
    i, total : INTEGER
DESKRIPSI:
    i ← 1
    total ← 0
    WHILE i <= 5 DO
        total ← total + i
        i ← i + 1
    END WHILE
    OUTPUT total  {15}</pre><div class="pc-note">Kesalahan umum: lupa memperbarui <code>i</code>. Jika kondisi tetap TRUE dan tidak ada cara keluar, perulangan dapat berlangsung terus-menerus.</div>`},
 {title:'Pseudocode dengan array sederhana',desc:'Mendeklarasikan kumpulan data dan mengakses elemen menggunakan indeks.',body:`<p><strong>Array</strong> menyimpan sejumlah elemen bertipe sama di bawah satu nama. Elemen dipilih dengan indeks. Dalam contoh ini, indeks dimulai dari 1; sistem lain bisa menggunakan indeks awal 0, sehingga konvensinya harus disebutkan.</p><pre class="pc-code">PROGRAM RataRataNilai
DEKLARASI:
    nilai : ARRAY[1..3] OF INTEGER
    total, i : INTEGER
    rataRata : REAL
DESKRIPSI:
    nilai[1] ← 80
    nilai[2] ← 90
    nilai[3] ← 70
    total ← 0
    FOR i ← 1 TO 3 DO
        total ← total + nilai[i]
    END FOR
    rataRata ← total / 3
    OUTPUT rataRata  {80}</pre><p><code>nilai[2]</code> merujuk elemen kedua, yaitu 90 pada contoh. Batas <code>ARRAY[1..3]</code> berarti array memiliki tiga elemen dengan indeks 1, 2, dan 3 dalam notasi yang dipakai di sini.</p>`},
 {title:'Prosedur dan fungsi dalam pseudocode',desc:'Membaca subprogram, parameter, dan nilai yang dikembalikan fungsi.',body:`<p>Algoritma yang lebih besar dapat dibagi menjadi prosedur atau fungsi. <strong>Parameter</strong> adalah masukan yang diterima subprogram. Dalam konvensi modul ini, fungsi yang menghasilkan nilai memakai <code>RETURN</code>.</p><h3>Contoh fungsi</h3><pre class="pc-code">FUNCTION LuasPersegiPanjang(panjang : REAL, lebar : REAL) : REAL
DEKLARASI:
    luas : REAL
DESKRIPSI:
    luas ← panjang * lebar
    RETURN luas
END FUNCTION</pre><h3>Memanggil fungsi</h3><pre class="pc-code">PROGRAM Utama
DEKLARASI:
    hasil : REAL
DESKRIPSI:
    hasil ← LuasPersegiPanjang(5, 3)
    OUTPUT hasil  {15}</pre><p>Fungsi menerima 5 dan 3 sebagai parameter, menghitung 5 × 3, lalu mengembalikan 15 kepada pemanggil. Detail format fungsi dapat berbeda sesuai konvensi yang digunakan.</p>`},
 {title:'Komentar dan dokumentasi',desc:'Menambahkan penjelasan yang membantu pembaca memahami tujuan algoritma.',body:`<p>Komentar adalah catatan untuk manusia, bukan langkah yang diproses sebagai instruksi. Modul ini menggunakan kurung kurawal <code>{ ... }</code> untuk komentar. Pada konvensi lain, simbol komentar dapat berbeda.</p><pre class="pc-code">PROGRAM HitungDiskon
{Menghitung harga setelah diskon 10%}
DEKLARASI:
    harga, diskon, total : REAL
DESKRIPSI:
    INPUT harga
    diskon ← harga * 0.10  {10 persen dari harga}
    total ← harga - diskon
    OUTPUT "Total bayar = ", total</pre><p>Komentar yang baik menjelaskan tujuan, asumsi, atau alasan suatu langkah. Hindari komentar yang hanya mengulang isi baris secara tidak perlu.</p>`},
 {title:'Contoh lengkap 1 — menghitung total belanja',desc:'Contoh lengkap dengan judul, deklarasi, tipe data, proses, dan output.',body:`<p>Kasus: pengguna memasukkan harga satu barang dan jumlah barang. Algoritma menghitung subtotal. Semua bagian struktur ditulis lengkap.</p><pre class="pc-code">PROGRAM HitungTotalBelanja
{Menghitung subtotal berdasarkan harga satuan dan jumlah}

DEKLARASI:
    hargaSatuan : REAL
    jumlah      : INTEGER
    subtotal    : REAL

DESKRIPSI:
    INPUT hargaSatuan
    INPUT jumlah
    subtotal ← hargaSatuan * jumlah
    OUTPUT "Subtotal = Rp", subtotal</pre><p>Contoh masukan: <code>hargaSatuan = 12500</code> dan <code>jumlah = 4</code>. Prosesnya adalah 12.500 × 4, sehingga output subtotal adalah Rp50.000.</p><h3>Variasi: tambahkan diskon</h3><pre class="pc-code">PROGRAM TotalDenganDiskon
DEKLARASI:
    subtotal, diskon, total : REAL
DESKRIPSI:
    INPUT subtotal
    IF subtotal >= 100000 THEN
        diskon ← subtotal * 0.10
    ELSE
        diskon ← 0
    END IF
    total ← subtotal - diskon
    OUTPUT subtotal, diskon, total</pre><p>Untuk subtotal 120.000, diskon 12.000 dan total 108.000. Untuk subtotal 80.000, diskon 0 dan total 80.000.</p>`},
 {title:'Contoh lengkap 2 — menentukan bilangan ganjil atau genap',desc:'Menggabungkan deklarasi, input, MOD, dan percabangan.',body:`<p>Bilangan bulat adalah genap jika sisa pembagian oleh 2 sama dengan 0. Operator <code>MOD</code> digunakan untuk mendapatkan sisa pembagian.</p><pre class="pc-code">PROGRAM GanjilGenap
{Menentukan apakah bilangan bulat genap atau ganjil}
DEKLARASI:
    bilangan : INTEGER
DESKRIPSI:
    INPUT bilangan
    IF bilangan MOD 2 = 0 THEN
        OUTPUT "Genap"
    ELSE
        OUTPUT "Ganjil"
    END IF</pre><p>Jika masukan 18, maka <code>18 MOD 2</code> bernilai 0 sehingga output Genap. Jika masukan 13, sisanya 1 sehingga output Ganjil.</p>`},
 {title:'Contoh lengkap 3 — mencari nilai terbesar',desc:'Menggunakan perbandingan untuk menentukan nilai terbesar dari dua masukan.',body:`<p>Kasus: baca dua bilangan dan tampilkan nilai yang lebih besar. Jika nilainya sama, tampilkan pesan bahwa kedua bilangan sama.</p><pre class="pc-code">PROGRAM NilaiTerbesar
DEKLARASI:
    a, b : REAL
DESKRIPSI:
    INPUT a, b
    IF a > b THEN
        OUTPUT "Terbesar = ", a
    ELSE IF b > a THEN
        OUTPUT "Terbesar = ", b
    ELSE
        OUTPUT "Kedua nilai sama"
    END IF</pre><p>Contoh masukan 8 dan 12 menghasilkan “Terbesar = 12”. Masukan 7 dan 7 menghasilkan “Kedua nilai sama”.</p>`},
 {title:'Menguji dan memperbaiki pseudocode',desc:'Menelusuri variabel, memeriksa rumus, kondisi batas, dan hasil keluaran.',body:`<p>Periksa pseudocode dengan beberapa masukan, bukan hanya satu. Telusuri perubahan variabel baris demi baris, cek tipe data, pastikan rumus sesuai tujuan, dan uji kondisi batas.</p><h3>Contoh kesalahan rumus</h3><pre class="pc-code">PROGRAM LuasPersegiPanjang
DEKLARASI:
    panjang, lebar, luas : REAL
DESKRIPSI:
    INPUT panjang, lebar
    luas ← panjang + lebar   {SALAH: rumus luas}
    OUTPUT luas</pre><p>Jika panjang = 5 dan lebar = 3, kode salah menghasilkan 8, padahal luas seharusnya 15. Perbaikannya adalah <code>luas ← panjang * lebar</code>.</p><h3>Daftar periksa</h3><ul><li>Apakah judul menggambarkan tujuan?</li><li>Apakah semua variabel yang digunakan sudah dideklarasikan?</li><li>Apakah tipe data sesuai dengan nilainya?</li><li>Apakah penugasan menggunakan <code>←</code> dan perbandingan menggunakan operator yang tepat?</li><li>Apakah IF dan perulangan memiliki penutup blok yang sesuai?</li><li>Apakah output sesuai untuk masukan normal, batas, dan nilai yang sama?</li></ul>`},
 {title:'Ringkasan dan glosarium pseudocode',desc:'Merangkum struktur, notasi, tipe data, dan kata kunci penting.',body:`<h3>Ringkasan inti</h3><ul><li>Pseudocode menjelaskan logika dengan cara yang mudah dibaca manusia.</li><li>Struktur yang digunakan di modul ini adalah <strong>Judul → Deklarasi → Deskripsi</strong>.</li><li>Deklarasi mengenalkan variabel, konstanta, serta tipe data yang digunakan.</li><li>Deskripsi berisi langkah-langkah, dari input dan proses hingga output.</li><li><code>←</code> berarti penugasan; <code>=</code> berarti membandingkan kesamaan dalam konvensi ini.</li><li><code>IF</code> digunakan untuk percabangan; <code>FOR</code> dan <code>WHILE</code> untuk perulangan.</li><li>Notasi pseudocode dapat berbeda antar referensi, sehingga gunakan satu gaya yang konsisten.</li></ul><h3>Istilah penting</h3><p><strong>Deklarasi:</strong> bagian yang mengenalkan nama dan tipe. <strong>Variabel:</strong> nama untuk nilai yang dapat berubah. <strong>Konstanta:</strong> nilai yang tidak diubah. <strong>Ekspresi:</strong> gabungan nilai, variabel, dan operator. <strong>Iterasi:</strong> satu putaran perulangan. <strong>Parameter:</strong> data yang diterima fungsi atau prosedur. <strong>Return:</strong> nilai yang dikembalikan fungsi.</p><div class="pc-note">Gunakan tiga pertanyaan saat memeriksa contoh: Apa tujuan algoritmanya? Nama dan tipe apa yang diperlukan? Langkah apa yang dilakukan dan keluaran apa yang dihasilkan?</div>`}
];
const quizQuestions = [
 {q:'Dalam struktur pseudocode yang digunakan pada modul ini, urutan bagian yang benar adalah ...',opts:['Deklarasi, Deskripsi, Judul','Judul, Deklarasi, Deskripsi','Deskripsi, Judul, Deklarasi','Judul, Deskripsi, Deklarasi'],a:1,why:'Modul ini menggunakan struktur Judul (nama/tujuan), Deklarasi (nama dan tipe yang digunakan), lalu Deskripsi (langkah penyelesaian). Gaya penulisan lain dapat berbeda, tetapi harus konsisten.'},
 {q:'Bagian mana yang mencantumkan variabel beserta tipe datanya?',opts:['Judul','Deklarasi','Deskripsi saja','Komentar'],a:1,why:'Deklarasi mengenalkan variabel, konstanta, dan tipe data yang akan dipakai dalam langkah algoritma.'},

 {q:'Apa hasil `17 MOD 5`?',opts:['2','3','5','12'],a:0,why:'17 dibagi 5 menghasilkan 3 dengan sisa 2, jadi 17 MOD 5 = 2.'},

 {q:'Struktur yang lazim digunakan ketika rentang penghitung sudah diketahui adalah ...',opts:['FOR','IF saja','INPUT saja','RETURN'],a:0,why:'FOR cocok untuk mengulang instruksi pada rentang atau jumlah iterasi yang sudah diketahui.'},

 {q:'Jika panjang = 5 dan lebar = 3, rumus yang benar untuk luas persegi panjang adalah ...',opts:['luas ← panjang + lebar','luas ← panjang * lebar','luas ← panjang - lebar','luas ← panjang / lebar'],a:1,why:'Luas persegi panjang dihitung dengan panjang dikalikan lebar, yaitu 5 × 3 = 15.'}
];
const glossary = [
 ['Pseudocode','Penulisan langkah penyelesaian masalah yang menyerupai kode program, mudah dibaca manusia, dan tidak terikat sintaks satu bahasa tertentu.'],['Judul','Bagian yang menamai algoritma dan dapat menjelaskan tujuan singkatnya.'],['Deklarasi','Bagian yang mengenalkan variabel, konstanta, tipe data, atau subprogram yang digunakan.'],['Deskripsi','Bagian yang berisi langkah-langkah penyelesaian masalah secara terurut.'],['Tipe data','Kategori nilai, misalnya INTEGER, REAL, STRING, CHAR, dan BOOLEAN.'],['INTEGER','Tipe untuk bilangan bulat.'],['REAL','Tipe untuk bilangan yang dapat memiliki pecahan.'],['STRING','Tipe untuk rangkaian karakter atau teks.'],['CHAR','Tipe untuk satu karakter dalam konvensi yang digunakan.'],['BOOLEAN','Tipe logika yang memiliki nilai TRUE atau FALSE.'],['Variabel','Nama yang digunakan untuk mewakili nilai yang dapat berubah.'],['Konstanta','Nama untuk nilai yang ditetapkan dan tidak diubah selama algoritma berjalan.'],['Penugasan','Instruksi untuk menyimpan hasil nilai atau ekspresi ke dalam variabel; modul ini memakai simbol ←.'],['Operator','Simbol atau kata untuk melakukan operasi aritmetika, perbandingan, atau logika.'],['INPUT','Instruksi untuk menerima atau membaca data.'],['OUTPUT','Instruksi untuk menampilkan informasi atau hasil.'],['IF','Kata kunci untuk menjalankan instruksi berdasarkan kondisi.'],['ELSE','Bagian alternatif ketika kondisi IF tidak terpenuhi.'],['FOR','Struktur perulangan dengan rentang penghitung yang ditentukan.'],['WHILE','Struktur perulangan yang berlangsung selama kondisi bernilai TRUE.'],['Iterasi','Satu putaran dari sebuah perulangan.'],['Array','Kumpulan elemen yang diakses menggunakan indeks.'],['Indeks','Nomor atau posisi yang digunakan untuk memilih elemen array.'],['Parameter','Data masukan yang diterima prosedur atau fungsi.'],['RETURN','Instruksi yang mengembalikan nilai dari fungsi dalam konvensi modul ini.'],['Komentar','Catatan untuk pembaca yang menjelaskan tujuan atau asumsi, bukan instruksi utama.'],['MOD','Operator untuk memperoleh sisa pembagian bilangan bulat.'],['Debugging','Proses menemukan dan memperbaiki kesalahan pada penulisan atau logika pseudocode.']
];

ine="deklarasi"><span class="ln">03</span><span> panjang, lebar : <span class="val">REAL</span></span></div><div class="pc-code-line" data-visual-line="deklarasi"><span class="ln">04</span><span> luas : <span class="val">REAL</span></span></div><div class="pc-code-line" data-visual-line="deskripsi"><span class="ln">05</span><span><span class="kw">DESKRIPSI:</span></span></div><div class="pc-code-line" data-visual-line="deskripsi"><span class="ln">06</span><span> <span class="kw">INPUT</span> panjang, lebar</span></div><div class="pc-code-line" data-visual-line="deskripsi"><span class="ln">07</span><span> luas ← panjang × lebar</span></div><div class="pc-code-line" data-visual-line="deskripsi"><span class="ln">08</span><span><span class="kw">OUTPUT</span> luas</span></div></div></div><div class="pc-visual-controls" role="group" aria-label="Jelajahi struktur pseudocode"><button class="active" data-visual="judul">① Judul</button><button data-visual="deklarasi">② Deklarasi</button><button data-visual="deskripsi">③ Deskripsi</button></div><p class="pc-visual-hint" id="visualHint" aria-live="polite">Judul memberi nama pada algoritma yang dibuat.</p></div></div></section><div class="pc-grid"><div class="pc-stat"><span>Submateri selesai</span><strong>${new Set(state.completed).size} / ${topics.length}</strong></div><div class="pc-stat"><span>Progres pembelajaran</span><strong>${p}%</strong><div class="pc-track"><span style="width:${p}%"></span></div></div><div class="pc-stat"><span>Skor kuis terakhir</span><strong>${state.quizScore===null?'—':state.quizScore+'%'}</strong></div></div><div class="pc-section-head"><div><h2>Jalur pembelajaran</h2><p>Materi disusun dari pengertian, struktur, notasi, tipe data, hingga contoh pseudocode lengkap dan latihan.</p></div><span class="pc-badge">${topics.length} submateri</span></div><div class="pc-grid">${topics.map((t,i)=>`<article class="pc-card" style="--card-index:${i%12}" data-topic="${i}" tabindex="0" role="button"><span class="tag">${String(i+1).padStart(2,'0')} · ${state.completed.includes(i)?'✓ Selesai':'Submateri'}</span><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p><div class="pc-track"><span style="width:${state.completed.includes(i)?'100%':'0%'}"></span></div></article>`).join('')}</div><div class="pc-section-head"><div><h2>Mulai dari praktik</h2><p>Latihan langsung untuk membaca, menulis, dan memeriksa pseudocode.</p></div></div><div class="pc-grid"><article class="pc-card" data-action="lab"><span class="tag">✦ INTERAKTIF</span><h3>Praktik Pseudocode</h3><p>Pelajari contoh pseudocode lengkap dan kerjakan latihan mandiri.</p></article><article class="pc-card" data-action="project"><span class="tag">▣ CONTOH</span><h3>Contoh pseudocode kasir</h3><p>Pelajari penugasan, perulangan, percabangan, dan OUTPUT melalui contoh.</p></article><article class="pc-card" data-action="quiz"><span class="tag">✓ EVALUASI</span><h3>Kuis pemahaman</h3><p>Kerjakan soal dan baca penjelasan di setiap jawaban.</p></article></div>`;}

function lessonLab(i){
if(i===0)return `<div class="pc-lab"><h3>Kenali bagian pseudocode</h3><p>Pilih instruksi untuk melihat fungsi setiap bagian pseudocode.</p><div class="pc-flow" id="conceptFlow">${[['INPUT nama','Menerima nilai nama dari pengguna.'],['nama = "Ayu"','Memberikan nilai ke variabel nama.'],['OUTPUT nama','Menampilkan nilai yang tersimpan.'],['END','Menandai akhir contoh pseudocode.']].map((x,j)=>`<button data-concept="${j}">${x[0]}</button>${j<3?'<span class="pc-arrow">→</span>':''}`).join('')}</div><div class="pc-output" id="conceptExplain">Pilih salah satu baris di atas.</div><div id="representation" class="pc-code">BEGIN
    INPUT nama
    OUTPUT "Halo, ", nama
END</div></div>`;
if(i===1)return `<div class="pc-lab"><h3>Kenali struktur pseudocode</h3><p>Pilih baris untuk memahami perannya.</p><div id="syntaxCode" class="pc-code"></div><div id="syntaxExplain" class="pc-output">Pilih baris kode untuk melihat penjelasan.</div><button class="pc-btn" data-action="run-syntax">Langkah berikutnya</button></div>`;
if(i===2)return `<div class="pc-lab"><h3>Contoh aturan penulisan</h3><div class="pc-code">BEGIN
    INPUT harga, jumlah
    totalHarga = harga * jumlah
    OUTPUT totalHarga
END</div><p>Gunakan satu instruksi per baris, nama variabel yang jelas, dan indentasi yang konsisten.</p></div>`;
if(i===3)return `<div class="pc-lab"><h3>Contoh kata kunci</h3><div class="pc-code">INPUT nilai
IF nilai >= 75 THEN
    OUTPUT "Lulus"
ELSE
    OUTPUT "Belum lulus"
END IF</div><p>Perhatikan fungsi INPUT, IF, ELSE, OUTPUT, dan END IF.</p></div>`;
if(i===4)return variableLab();
if(i===5)return ipoLab();
if(i===6)return variableLab();
if(i===7)return sequenceLab();
if(i===8)return branchLab();
if(i===9||i===10)return loopLab();
if(i===11)return arrayLab();
if(i===12)return functionLab();
if(i===13)return `<div class="pc-lab"><h3>Contoh komentar</h3><div class="pc-code">// Menghitung total harga
INPUT harga
INPUT jumlah
total = harga * jumlah
OUTPUT total</div><p>Baris komentar menjelaskan tujuan kode, sedangkan baris lainnya merupakan instruksi pseudocode.</p></div>`;
if(i===14)return sequenceLab();
if(i===15)return debugLab();
if(i===16)return projectLab();
return '';
}

function ipoLab(){return `<div class="pc-lab"><h3>Simulasi Input–Process–Output</h3><div class="pc-controls"><label>Panjang <input id="ipoLength" type="number" min="0" step="any" value="8"></label><label>Lebar <input id="ipoWidth" type="number" min="0" step="any" value="4"></label><button class="pc-btn primary" data-action="run-ipo">Jalankan proses</button></div><div class="pc-flow" id="ipoFlow"><button data-ipo="input">1 · Input</button><span class="pc-arrow">→</span><button data-ipo="process">2 · Proses</button><span class="pc-arrow">→</span><button data-ipo="output">3 · Output</button></div><div id="ipoResult" class="pc-output">Masukkan panjang dan lebar, lalu jalankan algoritma.</div><div id="ipoCode" class="pc-code">INPUT panjang, lebar\nluas = panjang * lebar\nOUTPUT luas</div></div>`;}
function sequenceLab(){return `<div class="pc-lab"><h3>Jalankan sequence langkah demi langkah</h3><div class="pc-code" id="seqCode"></div><div class="pc-controls"><button class="pc-btn primary" data-action="seq-start">Mulai</button><button class="pc-btn" data-action="seq-prev">Langkah sebelumnya</button><button class="pc-btn" data-action="seq-next">Langkah berikutnya</button><button class="pc-btn" data-action="seq-pause">Jeda</button><button class="pc-btn" data-action="seq-reset">Ulangi</button></div><div id="seqOutput" class="pc-output">Tekan Mulai untuk menjalankan instruksi.</div></div>`;}
function branchLab(){return `<div class="pc-lab"><h3>Simulasi keputusan kelulusan</h3><p>Ubah nilai untuk melihat jalur IF atau ELSE yang dipilih.</p><div class="pc-controls"><label>Nilai siswa <input id="gradeValue" type="range" min="0" max="100" value="80" oninput="document.getElementById('gradeNum').textContent=this.value;window.pcBranchUpdate&&window.pcBranchUpdate()"></label><strong id="gradeNum">80</strong><input id="gradeNumber" type="number" min="0" max="100" value="80" style="width:80px" oninput="document.getElementById('gradeValue').value=this.value;document.getElementById('gradeNum').textContent=this.value;window.pcBranchUpdate&&window.pcBranchUpdate()"></div><div class="pc-flow"><button id="ifPath">IF nilai ≥ 75</button><span class="pc-arrow">→</span><button id="truePath">TRUE · Lulus</button><button id="falsePath">FALSE · Remedial</button></div><div id="branchResult" class="pc-output"></div><div class="pc-code">IF nilai >= 75 THEN\n    OUTPUT "Lulus"\nELSE\n    OUTPUT "Perlu remedial"\nEND IF</div></div>`;}
function loopLab(){return `<div class="pc-lab"><h3>Visualisasi perulangan</h3><div class="pc-controls"><label>Jenis <select id="loopMode"><option>FOR</option><option>WHILE</option></select></label><label>Batas <input id="loopLimit" type="number" min="1" max="20" value="5"></label><button class="pc-btn primary" data-action="loop-step">Langkah / iterasi berikutnya</button><button class="pc-btn" data-action="loop-reset">Ulangi</button></div><div class="pc-code" id="loopCode">FOR i = 1 TO 5\n    OUTPUT i\nEND FOR</div><div class="pc-output" id="loopResult">Belum ada iterasi dijalankan.</div><div class="pc-track"><span id="loopBar" style="width:0%"></span></div><p class="pc-small">Pengaman: batas maksimum 20 iterasi per simulasi.</p></div>`;}
function arrayLab(){return `<div class="pc-lab"><h3>Array: indeks bukan nilai</h3><p>Klik sel untuk memilih indeks. Ubah nilainya atau jumlahkan seluruh elemen.</p><div class="pc-array" id="arrayCells"></div><div class="pc-controls"><label>Indeks <select id="arrayIndex">${state.arr.map((_,i)=>`<option value="${i}" ${i===state.arrIndex?'selected':''}>${i}</option>`).join('')}</select></label><label>Nilai baru <input id="arrayValue" type="number" value="${state.arr[state.arrIndex]??0}"></label><button class="pc-btn" data-action="array-set">Perbarui elemen</button><button class="pc-btn primary" data-action="array-sum">Jumlahkan array</button></div><div id="arrayResult" class="pc-output">Pilih elemen untuk melihat indeks dan nilai.</div></div>`;}
function functionLab(){return `<div class="pc-lab"><h3>Fungsi menghitung luas</h3><p>Klik fungsi untuk melihat parameter, proses, dan nilai kembali.</p><div class="pc-flow"><button data-func="call">Pemanggil</button><span class="pc-arrow">→</span><button data-func="function">hitungLuas(p, l)</button><span class="pc-arrow">→</span><button data-func="return">return luas</button></div><div class="pc-controls"><label>Panjang <input id="fnLength" type="number" value="6" min="0"></label><label>Lebar <input id="fnWidth" type="number" value="3" min="0"></label><button class="pc-btn primary" data-action="run-function">Panggil fungsi</button></div><div id="fnResult" class="pc-output">Pilih salah satu bagian alur atau panggil fungsi.</div><div class="pc-code">FUNCTION hitungLuas(panjang, lebar)\n    luas = panjang * lebar\n    RETURN luas\nEND FUNCTION</div></div>`;}
function debugLab(){return `<div class="pc-lab"><h3>Detektif debugging</h3><p>Algoritma berikut seharusnya menampilkan luas. Baris mana yang bermasalah?</p><div class="pc-code">1. INPUT panjang, lebar\n2. luas = panjang + lebar\n3. OUTPUT luas</div><div class="pc-controls"><label>Pilih baris <select id="debugLine"><option value="1">Baris 1</option><option value="2">Baris 2</option><option value="3">Baris 3</option></select></label><button class="pc-btn primary" data-action="debug-check">Periksa jawaban</button></div><div id="debugResult" class="pc-output">Petunjuk: luas persegi panjang menggunakan perkalian.</div><button class="pc-btn" data-action="debug-fix">Lihat perbaikan</button></div>`;}
function projectLab(){return `<div class="pc-lab"><h3>Simulasi kasir kantin</h3><p>Gunakan simulasi ini sebagai contoh penerapan instruksi pseudocode untuk menghitung total dan memeriksa pembayaran.</p><div class="pc-product-list">${[['Roti',5000],['Susu',7000],['Air mineral',3000],['Nasi goreng',12000]].map(([name,price,i])=>`<div class="pc-product"><label><strong>${name}</strong><br><small>${money(price)}</small></label><input type="number" min="0" max="99" value="${state.projectCounts[['Roti','Susu','Air mineral','Nasi goreng'].indexOf(name)]||0}" data-product="${['Roti','Susu','Air mineral','Nasi goreng'].indexOf(name)}" aria-label="Jumlah ${name}"></div>`).join('')}</div><div class="pc-controls"><label>Uang pembayaran (Rp) <input id="paymentValue" type="number" min="0" step="500" value="20000"></label><button class="pc-btn primary" data-action="checkout">Proses transaksi</button><button class="pc-btn" data-action="project-reset">Reset</button></div><div id="checkoutResult" class="pc-output">Pilih jumlah barang lalu proses transaksi.</div><div id="checkoutCode" class="pc-code">total = 0\nFOR setiap barang\n    subtotal = harga * jumlah\n    total = total + subtotal\nEND FOR\nIF pembayaran >= total THEN\n    kembalian = pembayaran - total\n    OUTPUT total, kembalian\nELSE\n    OUTPUT \"Uang belum cukup\"\nEND IF</div></div>`;}
function renderLab(){return `<div class="pc-page-head"><div class="eyebrow">CONTOH DAN LATIHAN</div><h1>Laboratorium pseudocode</h1><p>Pelajari beberapa contoh pseudocode lengkap. Setiap contoh menggunakan struktur Judul, Deklarasi, dan Deskripsi sesuai konvensi modul ini.</p></div><div class="pc-panel pc-prose"><h2>Contoh A — menghitung luas segitiga</h2><pre class="pc-code">PROGRAM LuasSegitiga
{Menghitung luas segitiga dari alas dan tinggi}
DEKLARASI:
    alas, tinggi, luas : REAL
DESKRIPSI:
    INPUT alas
    INPUT tinggi
    luas ← (alas * tinggi) / 2
    OUTPUT "Luas segitiga = ", luas</pre><p>Jika alas = 10 dan tinggi = 6, luas = (10 × 6) / 2 = 30.</p><hr><h2>Contoh B — menentukan bilangan positif, negatif, atau nol</h2><pre class="pc-code">PROGRAM KlasifikasiBilangan
DEKLARASI:
    bilangan : REAL
DESKRIPSI:
    INPUT bilangan
    IF bilangan > 0 THEN
        OUTPUT "Positif"
    ELSE IF bilangan < 0 THEN
        OUTPUT "Negatif"
    ELSE
        OUTPUT "Nol"
    END IF</pre><p>Kondisi diperiksa berurutan. Nilai 0 tidak lebih besar atau lebih kecil dari 0, sehingga masuk ke ELSE.</p><hr><h2>Contoh C — menghitung jumlah 1 sampai N</h2><pre class="pc-code">PROGRAM JumlahSampaiN
DEKLARASI:
    n, i, total : INTEGER
DESKRIPSI:
    INPUT n
    total ← 0
    FOR i ← 1 TO n DO
        total ← total + i
    END FOR
    OUTPUT "Jumlah = ", total</pre><p>Jika n = 4, total yang dihitung adalah 1 + 2 + 3 + 4 = 10. Contoh mengasumsikan masukan n adalah bilangan bulat positif.</p><hr><h2>Latihan mandiri</h2><ol><li>Tulis pseudocode lengkap untuk menghitung keliling persegi. Gunakan variabel <code>sisi</code> dan <code>keliling</code>.</li><li>Tulis pseudocode untuk menghitung rata-rata empat nilai. Tentukan tipe data yang tepat.</li><li>Tulis pseudocode yang menerima umur dan menampilkan “Boleh mendaftar” jika umur minimal 17, atau “Belum memenuhi syarat” jika kurang dari 17.</li><li>Tulis pseudocode untuk menampilkan angka 5, 4, 3, 2, 1 menggunakan perulangan.</li></ol><div class="pc-note">Periksa setiap jawaban: apakah ada Judul, Deklarasi, dan Deskripsi? Apakah semua variabel dideklarasikan dan bertipe sesuai? Apakah rumus, kondisi, dan output sudah benar?</div></div>`;}
function renderQuiz(){const done=Object.keys(state.quizChecked).filter(k=>state.quizChecked[k]).length;return `<div class="pc-page-head"><div class="eyebrow">EVALUASI PEMAHAMAN</div><h1>Kuis & latihan</h1><p>Pilih jawaban, periksa, lalu baca alasan teknisnya. Kamu dapat mengubah jawaban dan mencoba ulang.</p></div><div class="pc-panel"><div class="pc-section-head"><div><h2>Uji pemahaman pseudocode</h2><p>10 soal · pilihan ganda dengan umpan balik</p></div><span class="pc-badge">${done}/${quizQuestions.length} diperiksa</span></div>${quizQuestions.map((q,i)=>`<div class="pc-lab" id="q${i}"><h3>${i+1}. ${q.q}</h3>${q.opts.map((o,j)=>`<button class="pc-quiz-option ${state.quizAnswers[i]===j?'chosen':''}" data-answer="${i}:${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}<div class="pc-controls"><button class="pc-btn" data-action="check-question" data-q="${i}">Periksa jawaban</button></div><div class="pc-feedback ${state.quizChecked[i]?'show '+(state.quizAnswers[i]===q.a?'good':'bad'):''}" id="feedback${i}">${state.quizChecked[i]?((state.quizAnswers[i]===q.a?'Benar. ':'Belum tepat. ')+q.why):''}</div></div>`).join('')}<div class="pc-actions"><button class="pc-btn primary" data-action="grade-quiz">Hitung skor</button><button class="pc-btn" data-action="reset-quiz">Ulangi kuis</button></div><div id="quizSummary" class="pc-output">${state.quizScore===null?'Selesaikan soal lalu hitung skor.':'Skor terakhir: '+state.quizScore+'%.'}</div></div>`;}
function renderProject(){return `<div class="pc-page-head"><div class="eyebrow">PROYEK MINI</div><h1>Proyek: pseudocode kasir sederhana</h1><p>Contoh utuh yang menggabungkan deklarasi, tipe data, penugasan, percabangan, dan keluaran.</p></div><div class="pc-panel pc-prose"><h2>Spesifikasi</h2><p>Program menerima harga satuan dan jumlah barang, menghitung subtotal, memberi diskon 10% jika subtotal minimal Rp100.000, lalu menampilkan subtotal, diskon, dan total pembayaran. Contoh ini tidak menghitung pajak atau metode pembayaran.</p><h2>Pseudocode</h2><pre class="pc-code">PROGRAM KasirSederhana
{Menghitung total belanja dengan diskon bersyarat}
DEKLARASI:
    hargaSatuan : REAL
    jumlah : INTEGER
    subtotal : REAL
    diskon : REAL
    totalBayar : REAL
DESKRIPSI:
    INPUT hargaSatuan
    INPUT jumlah
    subtotal ← hargaSatuan * jumlah
    IF subtotal >= 100000 THEN
        diskon ← subtotal * 0.10
    ELSE
        diskon ← 0
    END IF
    totalBayar ← subtotal - diskon
    OUTPUT "Subtotal = Rp", subtotal
    OUTPUT "Diskon = Rp", diskon

function renderGlossary(){return `<div class="pc-page-head"><div class="eyebrow">REFERENSI CEPAT</div><h1>Glosarium pseudocode</h1><p>Istilah penting untuk membantu membaca dan merancang algoritma.</p></div><div class="pc-panel"><div class="pc-controls"><label>Cari istilah <input id="glossarySearch" placeholder="Contoh: variabel, iterasi..."></label></div><div id="glossaryList" class="pc-grid">${glossary.map(([term,def])=>`<article class="pc-card" data-term="${esc(term.toLowerCase())}"><h3>${esc(term)}</h3><p>${esc(def)}</p></article>`).join('')}</div></div>`;}

function initSyntax(){const lines=['INPUT panjang, lebar','luas = panjang * lebar','OUTPUT luas','END'];$('syntaxCode').innerHTML=lines.map((x,i)=>`<div data-syntax="${i}" tabindex="0" style="padding:2px 6px;border-radius:5px;cursor:pointer">${i+1}. ${esc(x)}</div>`).join('');$('syntaxCode').onclick=e=>{const el=e.target.closest('[data-syntax]');if(!el)return;[...$('syntaxCode').children].forEach(x=>x.style.background='');el.style.background='#29456f';$('syntaxExplain').textContent=['INPUT menerima data panjang dan lebar dari pengguna.','Baris proses menghitung luas menggunakan perkalian.','OUTPUT menampilkan nilai luas yang sudah dihitung.','END menandai akhir contoh pseudocode.'][+el.dataset.syntax];};}
const variables={nama:{value:'Budi',type:'string',constant:false,desc:'Menyimpan teks berupa nama.'},umur:{value:16,type:'integer',constant:false,desc:'Menyimpan bilangan bulat umur.'},nilai:{value:85,type:'integer',constant:false,desc:'Nilai dapat diubah untuk melihat dampak perhitungan.'},PAJAK:{value:0.11,type:'real',constant:true,desc:'Konstanta tarif pajak contoh; dalam simulasi ini nilainya tidak dapat diubah.'}};
function initVariables(){const grid=$('variableGrid');if(!grid)return;grid.querySelectorAll('[data-var]').forEach(b=>b.addEventListener('click',()=>{state.selectedVar=b.dataset.var;grid.querySelectorAll('[data-var]').forEach(x=>x.classList.toggle('selected',x===b));const v=variables[state.selectedVar];const input=$('varValue');input.value=v.value;$('varExplain').textContent=`${state.selectedVar} · tipe ${v.type} · nilai ${v.value}. ${v.desc}`;}));const selected=variables[state.selectedVar]||variables.nilai;if($('varExplain'))$('varExplain').textContent=`${state.selectedVar} · tipe ${selected.type} · nilai ${selected.value}. ${selected.desc}`;}
function setVariable(){const k=state.selectedVar,v=variables[k];if(!v)return;if(v.constant){toast('Konstanta tidak dapat diubah.');return;}let raw=$('varValue').value;if(k==='nama'){if(!raw.trim()){toast('Nama tidak boleh kosong.');return;}v.value=raw.trim();}else{if(raw.trim()===''||!Number.isFinite(Number(raw))){toast('Masukkan nilai angka yang valid.');return;}v.value=Number(raw);}const grid=$('variableGrid');grid.querySelector(`[data-var="${k}"] strong`).textContent=v.value;$('varExplain').textContent=`${k} · tipe ${v.type} · nilai baru ${v.value}. ${v.desc}`;toast('Nilai variabel diperbarui.');}
function calcOperator(){const a=Number($('opA').value),b=Number($('opB').value),op=$('opKind').value;if($('opA').value.trim()===''||$('opB').value.trim()===''||!Number.isFinite(a)||!Number.isFinite(b)){toast('Isi kedua operand dengan angka valid.');return;}let r,desc;if(op==='+')r=a+b;else if(op==='-')r=a-b;else if(op==='*')r=a*b;else if(op==='/'){if(b===0){$('opResult').textContent='Tidak dapat membagi dengan nol.';return;}r=a/b;}else if(op==='MOD'){if(b===0){$('opResult').textContent='MOD dengan nol tidak terdefinisi.';return;}r=a%b;}else if(op==='>')r=a>b;else if(op==='>=')r=a>=b;else if(op==='=')r=a===b;else if(op==='AND')r=Boolean(a)&&Boolean(b);else r=Boolean(a)||Boolean(b);desc=['+','-','*','/','MOD'].includes(op)?`Hasil aritmetika ${a} ${op} ${b} = ${r}.`:`Hasil logika/perbandingan adalah ${r?'TRUE':'FALSE'}.`;$('opResult').textContent=`${a} ${op} ${b} = ${r} · ${desc}`;}
function runIPO(show=true){const l=$('ipoLength'),w=$('ipoWidth');if(!l||!w)return;const a=l.value.trim(),b=w.value.trim();const flow=$('ipoFlow');if(a===''||b===''||!Number.isFinite(Number(a))||!Number.isFinite(Number(b))||Number(a)<0||Number(b)<0){$('ipoResult').textContent='Input harus berupa angka nol atau lebih. Periksa panjang dan lebar.';return;}const area=Number(a)*Number(b);$('ipoResult').innerHTML=`<strong>Input:</strong> panjang = ${a}, lebar = ${b}<br><strong>Proses:</strong> luas = ${a} × ${b} = ${area}<br><strong>Output:</strong> Luas persegi panjang adalah ${area}.`;if(show)toast('Algoritma IPO selesai dijalankan.');}
const seqLines=['INPUT harga','INPUT jumlah','subtotal ← harga * jumlah','OUTPUT subtotal'];let seqTimer=null;
function drawSequence(){const c=$('seqCode');if(!c)return;c.innerHTML=seqLines.map((x,i)=>`<div data-seq="${i}" style="padding:2px 6px;border-radius:5px">${i+1}. ${esc(x)}</div>`).join('');highlightSequence();}

function seqNext(){if(state.seqStep<seqLines.length-1)state.seqStep++;highlightSequence();const messages=['Siapkan data harga barang.','Siapkan jumlah barang yang dibeli.','Kalikan harga dengan jumlah untuk mendapat subtotal.','Tampilkan subtotal kepada pengguna.'];$('seqOutput').textContent=state.seqStep<0?'Tekan Mulai untuk menjalankan instruksi.':messages[state.seqStep];if(state.seqStep===seqLines.length-1)$('seqOutput').textContent+=' Selesai.';}
function updateBranch(){const slider=$('gradeValue'),num=$('gradeNumber');if(!slider||!num)return;let n=Number(slider.value);if(!Number.isFinite(n))n=0;n=Math.max(0,Math.min(100,n));slider.value=n;num.value=n;$('gradeNum').textContent=n;const pass=n>=75;$('ifPath').classList.add('path-active');$('truePath').classList.toggle('path-active',pass);$('falsePath').classList.toggle('path-active',!pass);$('branchResult').innerHTML=`Kondisi <strong>${n} ≥ 75</strong> bernilai <strong>${pass?'TRUE':'FALSE'}</strong>. Jalur <strong>${pass?'IF':'ELSE'}</strong> dipilih. Output: <strong>${pass?'Lulus':'Perlu remedial'}</strong>.`;}

function drawLoop(){const m=$('loopMode'),lim=$('loopLimit');if(!m||!lim)return;const mode=m.value;const n=Math.max(1,Math.min(20,Number(lim.value)||1));$('loopCode').textContent=mode==='FOR'?`FOR i = 1 TO ${n}\n    OUTPUT i\nEND FOR`:`i = 1\nWHILE i <= ${n}\n    OUTPUT i\n    i = i + 1\nEND WHILE`;const out=$('loopResult');if(out&&loopCount===0)out.textContent='Belum ada iterasi dijalankan.';}
function loopStep(){const lim=Math.max(1,Math.min(20,Number($('loopLimit').value)||1));if(loopCount>=lim){$('loopResult').textContent=`Kondisi berhenti tercapai setelah ${loopCount} iterasi. Output: ${Array.from({length:loopCount},(_,i)=>i+1).join(', ')||'—'}.`;return;}loopCount++;$('loopResult').textContent=`Iterasi ${loopCount}: i = ${loopCount}; kondisi i <= ${lim} bernilai TRUE; output ${loopCount}. ${loopCount===lim?'Iterasi berikutnya berhenti karena kondisi FALSE.':''}`;$('loopBar').style.width=(loopCount/lim*100)+'%';}
function drawArray(){const cells=$('arrayCells');if(!cells)return;cells.innerHTML=state.arr.map((v,i)=>`<button class="pc-cell ${i===state.arrIndex?'active':''}" data-arr="${i}"><span class="idx">Indeks ${i}</span><span class="val">${v}</span></button>`).join('');cells.querySelectorAll('[data-arr]').forEach(b=>b.addEventListener('click',()=>{state.arrIndex=+b.dataset.arr;$('arrayIndex').value=state.arrIndex;$('arrayValue').value=state.arr[state.arrIndex];$('arrayResult').textContent=`A[${state.arrIndex}] = ${state.arr[state.arrIndex]}. Indeks ${state.arrIndex} adalah posisi; ${state.arr[state.arrIndex]} adalah nilai yang disimpan.`;drawArray();}));}
function setArray(){const i=Number($('arrayIndex').value),raw=$('arrayValue').value;if(raw.trim()===''||!Number.isFinite(Number(raw))){toast('Nilai array harus berupa angka.');return;}if(i<0||i>=state.arr.length){toast('Indeks di luar rentang array.');return;}state.arr[i]=Number(raw);state.arrIndex=i;drawArray();$('arrayResult').textContent=`Nilai A[${i}] diperbarui menjadi ${state.arr[i]}.`; }
function sumArray(){let total=0,steps=[];state.arr.forEach((v,i)=>{total+=v;steps.push(`A[${i}]=${v} → total ${total}`)});$('arrayResult').textContent=`Proses penjumlahan: ${steps.join(' · ')}. Jumlah seluruh elemen = ${total}.`;}

function checkout(){const products=[['Roti',5000],['Susu',7000],['Air mineral',3000],['Nasi goreng',12000]];let total=0,lines=[];for(let i=0;i<products.length;i++){const inp=document.querySelector(`[data-product="${i}"]`);const raw=inp?inp.value:'0';if(raw.trim()===''||!Number.isInteger(Number(raw))||Number(raw)<0||Number(raw)>99){$('checkoutResult').textContent='Jumlah barang harus bilangan bulat 0–99.';return;}const qty=Number(raw),sub=qty*products[i][1];state.projectCounts[i]=qty;if(qty){lines.push(`${products[i][0]}: ${qty} × ${money(products[i][1])} = ${money(sub)}`);total+=sub;}}const raw=$('paymentValue').value;if(raw.trim()===''||!Number.isFinite(Number(raw))||Number(raw)<0){$('checkoutResult').textContent='Pembayaran harus berupa angka nol atau lebih.';return;}const pay=Number(raw);if(total===0){$('checkoutResult').textContent='Pilih minimal satu barang sebelum memproses transaksi.';return;}if(pay<total){$('checkoutResult').innerHTML=`${lines.join('<br>')}<hr><strong>Total: ${money(total)}</strong><br>Pembayaran: ${money(pay)}<br><strong style="color:var(--danger)">Uang belum cukup. Kurang ${money(total-pay)}. Transaksi ditolak.</strong>`;}else{$('checkoutResult').innerHTML=`${lines.join('<br>')}<hr><strong>Total: ${money(total)}</strong><br>Pembayaran: ${money(pay)}<br><strong style="color:var(--success)">Kembalian: ${money(pay-total)}</strong><br>Transaksi berhasil.`;} }

function filterGlossary(){const q=($('glossarySearch')?.value||'').toLowerCase();document.querySelectorAll('[data-term]').forEach(card=>card.classList.toggle('hidden',!card.dataset.term.includes(q)&&!card.textContent.toLowerCase().includes(q)));}
$('searchInput').addEventListener('input',()=>{const q=$('searchInput').value.trim().toLowerCase(),box=$('searchResults');if(!q){box.classList.add('hidden');return;}const results=topics.map((t,i)=>({title:t.title,desc:t.desc,fn:()=>openTopic(i)})).filter(x=>(x.title+' '+x.desc).toLowerCase().includes(q)).slice(0,8);const terms=glossary.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q)).slice(0,5);box.innerHTML=[...results.map((x,i)=>`<button data-search-topic="${topics.indexOf(topics.find(t=>t.title===x.title))}"><strong>${esc(x.title)}</strong><br><small>${esc(x.desc)}</small></button>`),...terms.map(x=>`<button data-search-gloss="${esc(x[0])}"><strong>${esc(x[0])}</strong><br><small>${esc(x[1])}</small></button>`)].join('')||'<div class="pc-small" style="padding:12px">Tidak ada hasil yang cocok.</div>';box.classList.remove('hidden');});
$('searchResults').addEventListener('click',e=>{const t=e.target.closest('[data-search-topic]');if(t){openTopic(+t.dataset.searchTopic);return;}const g=e.target.closest('[data-search-gloss]');if(g){setView('glossary');setTimeout(()=>{if($('glossarySearch')){$('glossarySearch').value=g.dataset.searchGloss;filterGlossary();}},0);}});
$('resetProgress').addEventListener('click',()=>{if(confirm('Atur ulang progres dan hasil kuis di perangkat ini?')){state.completed=[];state.quizAnswers={};state.quizChecked={};state.quizScore=null;save();render();toast('Progres lokal diatur ulang.');}});
$('appView').addEventListener('keydown',e=>{const t=e.target.closest('[data-topic]');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTopic(+t.dataset.topic);}});
render();updateProgress();
})();
</script>
</body>
</html>
